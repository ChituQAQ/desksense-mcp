[project]
name = "pc-sense-mcp"
version = "1.0.0"
description = "Windows 本机电脑感知 MCP（只读）— Streamable HTTP"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "psutil>=5.9.0",
    "pywin32>=305; sys_platform == 'win32'",
    "starlette>=0.37",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pc-sense = "pc_sense.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]